<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智能待办</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<!-- ============ 自绘标题栏（borderless 窗口） ============ -->
<div class="titlebar">
  <div class="tb-brand">
    <span class="tb-dot"></span>
    <span class="tb-title">智能待办</span>
    <span class="tb-ver" id="tbVer"></span>
  </div>
  <div class="tb-controls">
    <button class="tb-btn" id="winMin" data-tip="最小化"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14"/></svg></button>
    <button class="tb-btn" id="winMax" data-tip="最大化/还原"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="5" width="14" height="14" rx="1.5"/></svg></button>
    <button class="tb-btn tb-close" id="winClose" data-tip="关闭"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
  </div>
</div>

<div class="layout">
  <!-- ============ 侧边栏 ============ -->
  <aside class="sidebar">
    <div class="side-scroll">
      <!-- 提醒风格（人格类型）：一眼看懂“我是谁 + 会怎么提醒我” -->
      <button class="style-card" id="styleCard" data-tip="更改提醒风格">
        <div class="style-ic" id="styleIc">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
        </div>
        <div class="style-txt">
          <div class="style-label">提醒风格</div>
          <div class="style-name" id="styleName">组织者</div>
          <div class="style-desc" id="styleDesc">提前 6 小时提醒</div>
        </div>
        <svg class="style-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg>
      </button>

      <!-- 视图导航 -->
      <nav class="nav" id="viewNav">
        <div class="nav-title">任务视图</div>
        <button class="nav-item active" data-view="all">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
          <span>全部任务</span><span class="cnt" id="cntAll"></span>
        </button>
        <button class="nav-item" data-view="today">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
          <span>今日到期</span><span class="cnt" id="cntToday"></span>
        </button>
        <button class="nav-item" data-view="upcoming">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
          <span>即将到期</span><span class="cnt" id="cntUp"></span>
        </button>
        <button class="nav-item" data-view="overdue">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/></svg>
          <span>已逾期</span><span class="cnt" id="cntOver"></span>
        </button>
        <button class="nav-item" data-view="done">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.1V12a10 10 0 1 1-5.9-9.1"/><path d="M22 4L12 14l-3-3"/></svg>
          <span>已完成</span><span class="cnt" id="cntDone"></span>
        </button>
      </nav>

      <!-- 筛选 -->
      <div class="filters">
        <div class="filter-label">按优先级</div>
        <div class="chips" id="prioChips">
          <button class="chip active" data-prio="">全部</button>
          <button class="chip" data-prio="urgent">紧急</button>
          <button class="chip" data-prio="high">高</button>
          <button class="chip" data-prio="medium">中</button>
          <button class="chip" data-prio="low">低</button>
        </div>
        <div class="filter-label">
          按分类
          <button class="filter-edit" id="editCatBtn" data-tip="管理分类">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="12" height="12"><path d="M17 3a2.8 2.8 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5z"/></svg>
            管理
          </button>
        </div>
        <div class="chips" id="catChips"></div>
      </div>
    </div>

    <!-- 搜索（固定在侧边栏底部，始终可见） -->
    <div class="search">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.3-4.3"/></svg>
      <input id="searchInput" placeholder="搜索标题、描述或标签...">
    </div>
  </aside>

  <!-- ============ 主内容 ============ -->
  <main class="main">
    <div class="main-head">
      <h2 id="viewTitle">全部任务</h2>
      <div class="main-actions">
        <button class="icon-btn" id="trayBtn" data-tip="最小化到托盘">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19v-6M4 21h16M20 13v6M4 9l8-5 8 5"/></svg>
        </button>
        <button class="icon-btn" id="loginBtn" data-tip="开机自动启动">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v8M12 10L9 7M12 10l3-3"/><path d="M4 12a8 8 0 1 0 16 0"/></svg>
        </button>
        <button class="icon-btn" id="floatBtn" data-tip="悬浮窗开/关">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 3L15 15M3 15h12M15 15v6"/></svg>
        </button>
        <button class="icon-btn" id="settingsBtn" data-tip="设置">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>
        <button class="icon-btn" id="quickBtn" data-tip="快速添加（Ctrl+Alt+N）">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2L4.5 13.5H11l-1 8.5L19.5 10H13z"/></svg>
        </button>
        <button class="btn btn-ghost" id="exportBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg>
          导出
        </button>
        <button class="btn btn-primary" id="newBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 8v8M8 12h8"/></svg>
          新建任务
        </button>
      </div>
    </div>

    <!-- 统计卡片 -->
    <div class="stats">
      <div class="stat"><div class="ic ic-total"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg></div><div><div class="n1">任务总数</div><div class="n2" id="stTotal">0</div></div></div>
      <div class="stat"><div class="ic ic-done"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.1V12a10 10 0 1 1-5.9-9.1"/><path d="M22 4L12 14l-3-3"/></svg></div><div><div class="n1">已完成</div><div class="n2" id="stDone">0</div></div></div>
      <div class="stat"><div class="ic ic-pend"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg></div><div><div class="n1">进行中</div><div class="n2" id="stPend">0</div></div></div>
      <div class="stat"><div class="ic ic-over"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/></svg></div><div><div class="n1">已逾期</div><div class="n2" id="stOver">0</div></div></div>
    </div>

    <!-- 内容网格 -->
    <div class="grid" id="contentGrid">
      <!-- 任务表单（点击“新建任务”后出现） -->
      <div class="card" id="formCard" hidden>
        <div class="card-title">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><circle cx="12" cy="12" r="10"/><path d="M12 8v8M8 12h8"/></svg>
          <span id="formTitleText">新建任务</span>
          <button type="button" class="icon-btn" id="formClose" data-tip="关闭" style="margin-left:auto;width:30px;height:30px">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="15" height="15"><path d="M18 6L6 18M6 6l12 12"/></svg>
          </button>
        </div>
        <form class="form" id="taskForm">
          <div class="row"><label>任务标题 *</label><input id="fTitle" placeholder="要做什么？" required></div>
          <div class="row"><label>描述</label><textarea id="fDesc" placeholder="补充细节..."></textarea></div>
          <div class="inline-2">
            <div class="row"><label>截止日期 (DDL)</label><input type="date" id="fDue"></div>
            <div class="row"><label>截止时间</label><input type="time" id="fTime"></div>
          </div>
          <div class="row"><label>优先级</label>
            <div class="prio-grid" id="prioGrid">
              <button type="button" class="prio-opt active" data-priority="medium">中</button>
              <button type="button" class="prio-opt" data-priority="high">高</button>
              <button type="button" class="prio-opt" data-priority="urgent">紧急</button>
              <button type="button" class="prio-opt" data-priority="low">低</button>
            </div>
          </div>
          <div class="row"><label>分类</label>
            <div class="cat-grid" id="catGrid"></div>
          </div>
          <div class="row"><label>标签 (逗号分隔)</label><input id="fTags" placeholder="如：重要, 项目A"></div>
          <div class="row"><label class="switch"><input type="checkbox" id="fNotify" checked><span class="track"></span>启用智能提醒</label><div class="hint" id="notifyHint"></div></div>
          <div style="display:flex;gap:.6rem">
            <button type="submit" class="btn btn-primary" style="flex:1;justify-content:center">保存任务</button>
            <button type="button" class="btn btn-ghost" id="formReset" hidden>重置</button>
          </div>
        </form>
      </div>

      <!-- 任务列表 -->
      <div class="card">
        <div class="card-title">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M21 8l-9-5-9 5v11a1 1 0 0 0 1 1h16a1 1 0 0 0 1-1V8z"/></svg>
          任务列表 <span style="font-size:12px;color:var(--t2);margin-left:auto" id="listCount"></span>
        </div>
        <div class="tlist" id="taskList"></div>
      </div>
    </div>
  </main>
</div>

<!-- 新建任务悬浮卡片的遮罩（点击关闭） -->
<div id="formBackdrop" hidden></div>

<!-- ============ 提醒风格：独立覆盖界面（本软件特色功能） ============ -->
<div class="overlay style-overlay" id="styleModal" hidden>
  <div class="style-panel">
    <div class="sp-head">
      <div class="sp-head-txt">
        <h3>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
          选择你的提醒风格
        </h3>
        <p>风格决定提醒几次、分别在什么时候提醒你</p>
      </div>
      <button class="icon-btn" id="styleClose" data-tip="关闭"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
    </div>
    <div class="sp-grid" id="styleGrid"></div>
    <div class="sp-foot">
      <span class="sp-cur" id="styleCur"></span>
      <div class="sp-btns">
        <button class="btn btn-ghost" id="styleCancel">取消</button>
        <button class="btn btn-primary" id="styleApply">应用此风格</button>
      </div>
    </div>
  </div>
</div>

<!-- 设置模态框 -->
<div class="modal-overlay" id="settingsModal" hidden>
  <div class="modal">
    <div class="modal-head">
      <h3>设置 <span class="dirty-hint" id="dirtyHint" hidden>有未保存的更改</span></h3>
      <button class="icon-btn" id="settingsClose" data-tip="关闭"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
    </div>
    <div class="set-group">
      <label>外观</label>
      <div class="seg" id="themeSeg">
        <button class="seg-btn" data-theme="system">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
          跟随系统
        </button>
        <button class="seg-btn" data-theme="light">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M19 5l-1.5 1.5M6.5 17.5L5 19"/></svg>
          浅色
        </button>
        <button class="seg-btn" data-theme="dark">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          深色
        </button>
      </div>
      <div class="hint">跟随系统时，随系统深浅色实时切换</div>
    </div>
    <div class="set-group">
      <label>主题色</label>
      <div class="accents" id="accentRow"></div>
      <div class="hint">用于按钮与灵动岛的强调色</div>
    </div>
    <div class="set-group">
      <label>提醒风格</label>
      <div class="style-entry" id="styleEntry">
        <div class="se-ic" id="seIc">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
        </div>
        <div class="se-txt">
          <div class="se-name" id="seName">组织者</div>
          <div class="se-desc" id="seDesc"></div>
        </div>
        <button class="btn btn-primary" id="seChange" style="padding:.4rem .8rem">更改风格</button>
      </div>
      <div class="hint">调整提醒次数与提醒时间点</div>
    </div>
    <div class="set-group"><label>提醒提前量 (分钟)</label><input type="number" id="setLead" min="1" max="1440"><div class="hint">到达提醒时间点后的容错窗口</div></div>
    <div class="set-group">
      <label>提醒方式</label>
      <label class="switch"><input type="checkbox" id="setSound" checked><span class="track"></span> 声音提示</label>
      <div class="hint">以应用内弹窗 + 灵动岛呈现</div>
    </div>
    <div class="set-group">
      <label>分类管理</label>
      <div class="cat-manager" id="catManager"></div>
      <div class="cat-add">
        <input id="newCatInput" placeholder="新分类名称">
        <button class="btn btn-ghost" id="addCatBtn" style="padding:.4rem .7rem">添加</button>
      </div>
      <div class="hint">删除分类时，其下任务归入「其他」</div>
    </div>
    <div class="set-group">
      <label>退出操作</label>
      <div class="seg" id="closeActionSeg">
        <button class="seg-btn" data-act="ask">每次询问</button>
        <button class="seg-btn" data-act="tray">后台常驻</button>
        <button class="seg-btn" data-act="quit">彻底退出</button>
      </div>
      <div class="hint">关闭窗口时执行，选好即生效</div>
    </div>
    <div class="set-group">
      <label>数据</label>
      <div style="display:flex;flex-wrap:wrap;gap:.6rem">
        <button class="btn btn-primary" onclick="saveSettings()">保存设置</button>
        <button class="btn btn-ghost" id="openDataDirBtn">打开数据目录</button>
        <button class="btn btn-danger" id="clearDataBtn">清空任务</button>
      </div>
    </div>
  </div>
</div>

<!-- ============ 快速添加（全局快捷键 Ctrl+Alt+N 唤起） ============ -->
<div class="overlay quick-overlay" id="quickModal" hidden>
  <div class="quick-card">
    <div class="quick-head">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M13 2L4.5 13.5H11l-1 8.5L19.5 10H13z"/></svg>
      <span>快速添加</span>
    </div>
    <input id="quickInput" placeholder="交周报 明天 10:00 #工作 !高" autocomplete="off" spellcheck="false">
    <div class="quick-preview" id="quickPreview">回车添加，Esc 取消</div>
  </div>
</div>

<div class="toast-wrap" id="toastWrap"></div>
<!-- 自绘 tooltip 层（原生 title 的提示框在深色模式下仍是白底白边） -->
<div class="tip" id="tipLayer" hidden></div>

<!-- ============ 加载界面（启动遮罩，数据就绪后淡出） ============ -->
<div class="splash" id="splash">
  <div class="splash-inner">
    <div class="splash-logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
    </div>
    <h2>智能待办</h2>
    <div class="splash-bar"><div class="splash-bar-fill"></div></div>
    <p>正在加载数据…</p>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
